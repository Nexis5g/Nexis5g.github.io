<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png" type="image/png">

  <title>Просмотр видео</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0f0f0f;
      color:white;
    }

    header{
      background:#202020;
      padding:15px 25px;
    }

    header a{
      color:white;
      text-decoration:none;
      font-size:18px;
    }

    .watch-page{

      display:grid;

      grid-template-columns:2fr 400px;

      gap:20px;

      padding:20px;
    }

    .main-video{
      width:100%;
    }

    .video-box{

  position:relative;

  width:100%;

  padding-top:56.25%;

  background:black;

  border-radius:14px;

  overflow:hidden;
}

    iframe{

  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:100%;

  border:none;
}

    .controls{

      display:flex;

      justify-content:flex-end;

      margin-top:10px;
    }

    .controls button{

      background:rgb(179, 0, 255);

      color:white;

      border:none;

      padding:12px 18px;

      border-radius:8px;

      cursor:pointer;

      font-size:16px;
    }

    h1{
      margin-top:20px;
      font-size:28px;
    }

    .actions{

      display:flex;

      align-items:center;

      gap:20px;

      margin-top:20px;
    }

    #likeBtn{

      background:#272727;

      border:none;

      color:white;

      padding:12px 20px;

      border-radius:30px;

      cursor:pointer;

      font-size:16px;
    }

    .liked{
      background:rgb(179, 0, 255) !important;
    }

    .likes-count{
      color:#aaa;
    }

    .recommended{

      background:#181818;

      border-radius:12px;

      padding:15px;

      height:fit-content;
    }

    .recommended h2{
      margin-bottom:15px;
    }

    .rec-card{

      display:flex;

      gap:10px;

      margin-bottom:15px;

      text-decoration:none;

      color:white;
    }

    .rec-card iframe{

      width:160px;

      height:90px;

      border:none;

      border-radius:8px;

      pointer-events:none;
    }

    .rec-info h3{

      font-size:15px;

      margin-bottom:5px;
    }

    .rec-info p{

      color:#aaa;

      font-size:13px;
    }

    .rec-thumb{

  width:160px;

  height:90px;

  object-fit:cover;

  border-radius:8px;
}

    @media(max-width:1100px){

      .watch-page{

        grid-template-columns:1fr;
      }

    }

    @media(max-width:900px){

      iframe{
        height:400px;
      }

    }

  </style>
</head>
<body>

<header>

  <a href="index.html">
    ← Назад
  </a>

</header>

<div class="watch-page">

  <div class="main-video">

    <div class="video-box"
         id="videoBox">

      <iframe
        id="player"
        allowfullscreen>
      </iframe>

    </div>

    <div class="controls">

    </div>

    <h1 id="title"></h1>

    <div class="actions">

      <button
        id="likeBtn"
        onclick="toggleLike()">

        👍
        <span id="likeText">
          Лайк
        </span>

      </button>

      <div class="likes-count">

        Лайков:
        <span id="likesCount">
          0
        </span>

      </div>

    </div>

  </div>

  <div class="recommended">

    <h2>Рекомендации</h2>

    <div id="recommendedList"></div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>

<script>

const params =
  new URLSearchParams(window.location.search);

const id = params.get("id");

let currentVideo = null;
let account =
  JSON.parse(localStorage.getItem("account"));

(async function initPage(){
  await initSupabase();

  if(account?.username){
    const profile = await getProfile(account.username);
    if(profile){
      account = profile;
      localStorage.setItem("account", JSON.stringify({ username: account.username }));
    }
  }

  const allVideos = await getVideos();

  currentVideo =
    allVideos.find(v => v.id == id);

  if(currentVideo){
    document.getElementById("player").src =
      `https://drive.google.com/file/d/${currentVideo.driveId}/preview`;

    document.getElementById("title").innerText =
      currentVideo.title;

    await saveHistory();
    await initLikes();
    loadRecommendations(allVideos);
  }
})();

async function saveHistory(){
  if(!account?.username){
    return;
  }

  await recordHistory(account.username, id);
}

async function initLikes(){
  let likedVideos = [];

  if(account?.username){
    const profile = await getProfile(account.username);
    likedVideos = profile?.liked_videos || [];
  }
  else{
    likedVideos = JSON.parse(
      localStorage.getItem("likedVideos") || "[]"
    );
  }

  updateLikes(likedVideos);
}

async function toggleLike(){
  let likedVideos = [];

  if(account?.username){
    likedVideos = await window.supabaseHelpers.toggleLike(account.username, id);
    account = await getProfile(account.username);
    currentVideo = await getVideoById(id);
  }
  else{
    likedVideos = JSON.parse(
      localStorage.getItem("likedVideos") || "[]"
    );

    if(likedVideos.includes(id)){
      likedVideos = likedVideos.filter(v => v != id);
    }
    else{
      likedVideos.push(id);
    }

    localStorage.setItem(
      "likedVideos",
      JSON.stringify(likedVideos)
    );
  }

  updateLikes(likedVideos);
}

function updateLikes(likedVideos = []){
  document.getElementById("likesCount")
  .innerText = currentVideo?.likes || 0;

  const btn =
    document.getElementById("likeBtn");

  const text =
    document.getElementById("likeText");

  if(likedVideos.includes(id)){

    btn.classList.add("liked");

    text.innerText =
      "Лайк поставлен";

  }

  else{

    btn.classList.remove("liked");

    text.innerText =
      "Лайк";

  }

}

function loadRecommendations(allVideos){

  const recommendedList =

    document.getElementById(
      "recommendedList"
    );

  recommendedList.innerHTML = "";

  const filtered =

    allVideos.filter(v => v.id != id);

  filtered.forEach(video => {

    recommendedList.innerHTML += `

      <a
        class="rec-card"

        href="
        watch.html?id=${video.id}
        ">

        <img

  class="rec-thumb"

  src="
  https://drive.google.com/thumbnail?id=${video.driveId}&sz=w500
  ">

        <div class="rec-info">

          <h3>
            ${video.title}
          </h3>

          <p>
            VideoTube
          </p>

        </div>

      </a>

    `;

  });

}

function openFullscreen(){

  const elem =
    document.getElementById("videoBox");

  if(elem.requestFullscreen){

    elem.requestFullscreen();

  }

}

</script>

</body>
</html>
