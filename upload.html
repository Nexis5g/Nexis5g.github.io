<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Загрузка видео</title>

  <style>

    body{
      margin:0;

      background:#0f0f0f;

      color:white;

      font-family:Arial;

      display:flex;

      justify-content:center;

      align-items:center;

      height:100vh;
    }

    .box{

      background:#181818;

      padding:40px;

      border-radius:14px;

      width:400px;
    }

    h1{
      margin-bottom:25px;
    }

    input{

      width:100%;

      padding:14px;

      margin-bottom:15px;

      border:none;

      border-radius:8px;

      background:#2a2a2a;

      color:white;

      font-size:16px;
    }

    button{

      width:107%;

      padding:14px;

      border:none;

      border-radius:8px;

      background:rgb(179, 0, 255);

      color:white;

      font-size:16px;

      cursor:pointer;
    }

  </style>
</head>
<body>

<div class="box">

  <h1>Загрузка видео</h1>

  <input
    type="text"
    id="title"
    placeholder="Название видео">

  <input
    type="text"
    id="driveId"
    placeholder="Google Drive ID">

  <button onclick="uploadVideo()">
    Загрузить
  </button>

</div>

<script>

function uploadVideo(){

  const title =
    document.getElementById("title").value;

  const driveId =
    document.getElementById("driveId").value;

  if(title.trim() == "" ||
     driveId.trim() == ""){

    return;

  }

  let uploadedVideos =

    JSON.parse(
      localStorage.getItem("uploadedVideos")
    ) || [];

  const newVideo = {

    id:Date.now(),

    title:title,

    driveId:driveId

  };

  uploadedVideos.push(newVideo);

  localStorage.setItem(

    "uploadedVideos",

    JSON.stringify(uploadedVideos)

  );

  location.href = "index.html";

}

</script>

</body>
</html>
