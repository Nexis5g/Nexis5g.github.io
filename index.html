<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ViceTube</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0f0f0f;
      color:white;
    }

    header{

      background:#202020;

      padding:15px 25px;

      display:flex;

      align-items:center;

      gap:20px;
    }

    .logo{

      color:rgb(179, 0, 255);

      font-size:28px;

      font-weight:bold;
    }

    .search-box{

      flex:1;

      display:flex;

      max-width:700px;
    }

    .search-box input{

      margin-left:30%;

      width:100%;

      padding:12px 16px;

      border:none;

      outline:none;

      background:#121212;

      color:white;

      border-radius:30px 0 0 30px;

      font-size:16px;
    }

    .search-box button{

      padding:12px 20px;

      border:none;

      background:#303030;

      color:white;

      border-radius:0 30px 30px 0;

      cursor:pointer;
    }

    .videos{

      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(320px,1fr));

      gap:20px;

      padding:20px;
    }

    .card{

      background:#181818;

      border-radius:12px;

      overflow:hidden;

      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.02);
    }

    iframe{

      width:100%;

      height:200px;

      border:none;

      pointer-events:none;
    }

    .info{
      padding:14px;
    }

    .info h3{
      margin-bottom:8px;
    }

    .info p{
      color:#aaa;
    }

    .account{
      position:relative;
    }

    .avatar{

      width:42px;
      height:42px;

      border-radius:50%;

      background:#303030;

      display:flex;
      justify-content:center;
      align-items:center;

      cursor:pointer;

      font-size:22px;
    }

    .menu{

      position:absolute;

      top:55px;
      right:0;

      width:220px;

      background:#202020;

      border-radius:12px;

      overflow:hidden;

      display:none;

      z-index:1000;
    }

    .menu button{

      width:100%;

      padding:14px;

      background:none;

      border:none;

      color:white;

      text-align:left;

      cursor:pointer;
    }

    .menu button:hover{
      background:#303030;
    }

    .username{

      padding:15px;

      border-bottom:1px solid #333;

      font-weight:bold;
    }

    .thumbnail{

  width:100%;

  height:200px;

  object-fit:cover;

  display:block;
}

  </style>
</head>
<body>

<header>

  <div class="logo">
    ViceTube
  </div>

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="Поиск">

    <button>
      🔍
    </button>

  </div>

  <div class="account">

    <div
      class="avatar"
      onclick="toggleMenu()">

      👤

    </div>

    <div class="menu" id="menu">

      <div id="accountContent"></div>

    </div>

  </div>

</header>

<div class="videos" id="videos"></div>

<script>

let videos = [];

const container =
  document.getElementById("videos");

Promise.all([

  fetch("videos.json")
  .then(res => res.json()),

  Promise.resolve(

    JSON.parse(
      localStorage.getItem("uploadedVideos")
    ) || []

  )

])

.then(([jsonVideos, uploadedVideos]) => {

  videos = [

    ...jsonVideos,

    ...uploadedVideos

  ];

  renderVideos(videos);

});

function renderVideos(list){

  container.innerHTML = "";

  list.forEach(video => {

    container.innerHTML += `

      <a
        href="watch.html?id=${video.id}"
        style="
          text-decoration:none;
          color:white;
        ">

        <div class="card">

        <img
        class="thumbnail"
        src="
        https://drive.google.com/thumbnail?id=${video.driveId}&sz=w1000">

          <div class="info">

            <h3>${video.title}</h3>

            <p>Google Drive Video</p>

          </div>

        </div>

      </a>

    `;

  });

}

function searchVideos(){

  const value =

    document
    .getElementById("searchInput")
    .value
    .toLowerCase();

  const filtered = videos.filter(video =>

    video.title
    .toLowerCase()
    .includes(value)

  );

  renderVideos(filtered);

}

document
.getElementById("searchInput")
.addEventListener("input", searchVideos);

const menu =
  document.getElementById("menu");

const accountContent =
  document.getElementById("accountContent");

function toggleMenu(){

  if(menu.style.display == "block"){

    menu.style.display = "none";

  }

  else{

    menu.style.display = "block";

  }

}

let account =
  JSON.parse(localStorage.getItem("account"));

if(account){

  accountContent.innerHTML = `

    <div class="username">

      ${account.username}

    </div>

    <button
  onclick="location.href='upload.html'">

  Загрузить видео

    </button>

    <button
      onclick="
      location.href='history.html'
      ">

      История

    </button>

    <button onclick="logout()">

      Выйти

    </button>

  `;

}

else{

  accountContent.innerHTML = `

    <button
      onclick="
      location.href='login.html'
      ">

      Войти

    </button>

  `;

}

function logout(){

  localStorage.removeItem("account");

  location.reload();

}

window.addEventListener("click", e => {

  if(!e.target.closest(".account")){

    menu.style.display = "none";

  }

});

</script>

</body>
</html>
