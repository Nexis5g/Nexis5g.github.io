<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ViceTube</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0f0f0f;
      color:white;
    }

    header{
      background:#202020;

      padding:15px 25px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:20px;
      flex-wrap:wrap;
    }

    .logo{
      color:#FF69B4;
      font-size:28px;
      font-weight:bold;
    }

    .search-box{
      flex:1;
      max-width:600px;

      display:flex;
    }

    .search-box input{

      width:100%;

      padding:12px 16px;

      background:#121212;

      border:1px solid #333;

      color:white;

      outline:none;

      border-radius:30px 0 0 30px;

      font-size:16px;
    }

    .search-box button{

      padding:12px 22px;

      border:none;

      background:#303030;

      color:white;

      cursor:pointer;

      border-radius:0 30px 30px 0;

      font-size:16px;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
      font-size:17px;
    }

    .videos{

      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(320px,1fr));

      gap:20px;

      padding:20px;
    }

    .card{

      background:#181818;

      border-radius:12px;

      overflow:hidden;

      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.02);
    }

    iframe{

      width:100%;

      height:200px;

      border:none;

      pointer-events:none;
    }

    .info{
      padding:14px;
    }

    .info h3{
      margin-bottom:8px;
    }

    .info p{
      color:#aaa;
      font-size:14px;
    }

  </style>
</head>
<body>

<header>

  <div class="logo">ViceTube</div>

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="Поиск">

    <button>
      🔍
    </button>

  </div>

  <nav>
    <a href="index.html">Главная</a>
    <a href="history.html">История</a>
  </nav>

</header>

<div class="videos" id="videos"></div>

<script>

let videos = [];

const container =
  document.getElementById("videos");

fetch("videos.json")

.then(response => response.json())

.then(data => {

  videos = data;

  renderVideos(videos);

});

function renderVideos(list){

  container.innerHTML = "";

  list.forEach(video => {

    container.innerHTML += `

      <a
        href="watch.html?id=${video.id}"
        style="text-decoration:none;color:white">

        <div class="card">

          <iframe
            src="https://drive.google.com/file/d/${video.driveId}/preview">
          </iframe>

          <div class="info">

            <h3>${video.title}</h3>

            <p>Google Drive Video</p>

          </div>

        </div>

      </a>

    `;

  });

}

function searchVideos(){

  const value =

    document
    .getElementById("searchInput")
    .value
    .toLowerCase();

  const filtered = videos.filter(video =>

    video.title
    .toLowerCase()
    .includes(value)

  );

  renderVideos(filtered);

}

document
.getElementById("searchInput")
.addEventListener("input", searchVideos);

</script>

</body>
</html>
