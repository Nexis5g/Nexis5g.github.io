<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png" type="image/png">

  <title>История</title>

  <style>

    body{
      margin:0;
      background:#0f0f0f;
      color:white;
      font-family:Arial;
    }

    header{
      background:#202020;
      padding:15px 25px;
    }

    .videos{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:20px;
      padding:20px;
    }

    .card{
      background:#181818;
      border-radius:12px;
      overflow:hidden;
    }

    .thumbnail{

  width:100%;

  height:200px;

  object-fit:cover;

  display:block;
  
    }

  </style>
</head>
<body>

<header>
  <a href="index.html" style="color:white;text-decoration:none">
    ← Главная
  </a>
</header>

<div class="videos" id="historyList"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>

<script>

let account =
  JSON.parse(localStorage.getItem("account"));

if(!account){

  location.href = "login.html";

}

(async function initHistory(){
  await initSupabase();

  let profile = account;
  if(account?.username){
    const remote = await getProfile(account.username);
    if(remote){
      profile = remote;
      localStorage.setItem("account", JSON.stringify({ username: profile.username }));
    }
  }

  const history = profile.history || [];
  const allVideos = await getVideos();
  const container =
    document.getElementById("historyList");

  history.reverse().forEach(id => {

    const video =

      allVideos.find(v => v.id == id);

    if(video){

      container.innerHTML += `

        <a
          href="watch.html?id=${video.id}"

          style="
            text-decoration:none;
            color:white;
          ">

          <div class="card">

            <img

            loading="lazy"

            class="thumbnail"

            src="
            https://drive.google.com/thumbnail?id=${video.driveId}&sz=w1000">

            <div style="padding:14px">

              <h3>${video.title}</h3>

              <p style="color:#aaa">
                Просмотрено
              </p>

            </div>

          </div>

        </a>

      `;

    }

  });

});

</script>

</body>
</html>
