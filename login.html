<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png" type="image/png">

  <title>Вход</title>

  <style>

    body{
      margin:0;
      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      background:#0f0f0f;

      font-family:Arial;
    }

    .box{

      background:#181818;

      padding:40px;

      border-radius:14px;

      width:320px;
    }

    h1{
      color:rgb(179, 0, 255);
      text-align:center;
      margin-bottom:25px;
    }

    input{

      width:90%;

      padding:14px;

      margin-bottom:15px;

      border:none;

      border-radius:8px;

      background:#2a2a2a;

      color:white;

      font-size:16px;
    }

    button{

      width:98%;

      padding:14px;

      border:none;

      border-radius:8px;

      background:rgb(179, 0, 255);

      color:white;

      font-size:16px;

      cursor:pointer;
      
    }

  </style>

<style id="mobile-responsive">
html,body{max-width:100%;overflow-x:hidden}
img,video,iframe{max-width:100%;height:auto}
@media (max-width:768px){
header{padding:12px !important;display:flex !important;flex-wrap:wrap !important;gap:10px}
header>*{max-width:100%}
.videos,.grid,.container{grid-template-columns:1fr !important}
main,.content,.container{padding:12px !important;width:100% !important}
input,select,textarea,button{max-width:100%}
video{width:100% !important}
.box{width:92% !important;padding:20px !important}
[style*="margin-left"]{margin-left:0 !important}
[style*="width: 70%"],[style*="width:70%"]{width:100% !important}
}
</style>
</head>
<body>

<div class="box">

  <h1>ViceTube</h1>

  <input
    type="text"
    id="username"
    placeholder="Имя">

  <button onclick="login()">
    Войти
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script>

async function login(){
  const username = document.getElementById("username").value.trim();
  if(!username){
    return;
  }

  await initSupabase();
  await loginAndSync(username);
  window.location.href = "index.html";
}

</script>

</body>
</html>
